<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вертикальный плеер (iPhone) — Одиночное видео</title>
    <style>
        :root {
            /* Ювелирная подгонка внутреннего экрана под маску iPhone */
            --v-top: 3%;      
            --v-left: 7%;     
            --v-width: 86%;   
            --v-height: 94%;  
            --v-round: 40px; 
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            width: 100%;
            max-width: 1000px;
        }

        /* КОРПУС ТЕЛЕФОНА */
        .phone-wrapper {
            position: relative;
            width: 280px;
            height: 570px;
            background: transparent; 
            border: none;
            flex-shrink: 0;
            z-index: 2;
        }

        .phone-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: contain;
        }

        /* ЭКРАН */
        .screen-area {
            position: absolute;
            top: var(--v-top);
            left: var(--v-left);
            width: var(--v-width);
            height: var(--v-height);
            background: #000000; 
            overflow: hidden;
            border-radius: var(--v-round);
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ТЕКСТОВАЯ ПАНЕЛЬ СБОКУ */
        .carousel-side {
            flex: 1;
            max-width: 420px;
        }

        .prompt-box {
            background: #fcfcfc;
            border: 1px solid #eee;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .header {
            font-size: 11px;
            font-weight: 700;
            color: #000000; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .text {
            font-size: 15px;
            line-height: 1.5;
            color: #000000;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="phone-wrapper">
        <img src="https://github.com/zhidandbor/academy-hes/releases/download/hes-media-2026-10-03/hes-33ec1aa2879bb2cb84a357c2d7bf4a96.png" class="phone-mask" alt="iPhone">
        <div class="screen-area">
            <video playsinline muted loop autoplay>
                <source src="https://github.com/zhidandbor/academy-hes/releases/download/hes-media-2026-10-03/hes-67681c112b8510fb16cfd28d3322040e.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="carousel-side">
        <div class="prompt-box">
            <div class="header">Результат промпта</div>
        </div>
    </div>
</div>

</body>
</html>
