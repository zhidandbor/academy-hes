<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горизонтальный плеер (iPad) — Одиночное видео</title>
    <style>
        :root {
            /* Ювелирная подгонка внутреннего экрана под маску iPad */
            --v-top: 7.2%;    
            --v-left: 5.2%;   
            --v-width: 89.6%; 
            --v-height: 85.6%;
            --v-round: 20px;  
        }

        * { 
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 600px; /* Ограничение по ширине iPad */
        }

        /* КОРПУС iPAD */
        .ipad-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; /* Соотношение сторон горизонтального iPad */
            background: transparent; 
            z-index: 2;
        }

        .ipad-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: contain;
        }

        /* ЭКРАН */
        .screen-area {
            position: absolute;
            top: var(--v-top);
            left: var(--v-left);
            width: var(--v-width);
            height: var(--v-height);
            background: #000000; 
            overflow: hidden;
            border-radius: var(--v-round);
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* ТЕКСТОВАЯ ПАНЕЛЬ ПОД АЙПАДОМ */
        .carousel-bottom {
            width: 100%;
        }

        .prompt-box {
            background: #fcfcfc;
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .header {
            font-size: 10px;
            font-weight: 700;
            color: #888; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .text {
            font-size: 15px;
            line-height: 1.5;
            color: #000000;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="ipad-wrapper">
        <img src="ipad2.png" class="ipad-mask" alt="iPad">
        <div class="screen-area">
            <video playsinline muted loop autoplay>
                <source src="../../../media/interactive2/29.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="carousel-bottom">
        <div class="prompt-box">
        </div>
    </div>
</div>

</body>
</html>
